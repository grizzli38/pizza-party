<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#29231f"><link rel="manifest" href="manifest.json"><title>Pizza Party</title>
<style>
:root{--bg:#f6f1e9;--card:#fff;--ink:#29241f;--muted:#746c64;--accent:#b43b2d;--line:#ddd3c7;--soft:#f1e7dc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}header{background:#29231f;color:#fff;padding:22px 18px}header h1{margin:0}header p{margin:4px 0 0;color:#ddd}main{max-width:1100px;margin:auto;padding:14px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}h2{margin-top:0}table{width:100%;border-collapse:collapse}th,td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;color:var(--muted)}.sub{font-size:12px;color:var(--muted);margin-top:3px}.qty{width:65px;padding:8px;border:1px solid var(--line);border-radius:8px}button{border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer}button.primary{background:var(--accent);color:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.box{border:1px solid var(--line);border-radius:11px;padding:11px;margin:9px 0}.box h3{margin:0 0 6px}.check{padding:5px 0;border-bottom:1px dashed var(--line)}.check:last-child{border:0}.check input:checked+label{text-decoration:line-through;color:var(--muted)}.small{font-size:12px;color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:1fr}.optional{display:none}main{padding:8px}}
</style></head><body><header><h1>🍕 Pizza Party</h1><p>Courses & boîtes de préparation</p></header><main>
<section class="card"><h2>Choisir les pizzas</h2><table><thead><tr><th>Pizza</th><th>Nombre</th></tr></thead><tbody id="rows"></tbody></table><div class="actions"><button class="primary" onclick="calc()">Calculer</button><button onclick="resetAll()">Remise à zéro</button></div></section>
<div class="grid"><section class="card"><h2>Liste de courses</h2><div id="count"></div><table><thead><tr><th>Ingrédient</th><th>Besoin</th><th>À acheter</th></tr></thead><tbody id="shop"></tbody></table><h3>Épices & condiments</h3><div id="spices"></div></section>
<section class="card"><h2>Boîtes de préparation</h2><p class="small">Une checklist par pizza.</p><div id="prep"></div></section></div>
</main><script>
let C;const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));const fmt=n=>Math.round(n*100)/100;
async function init(){C=await fetch("pizzas.json?"+Date.now()).then(r=>r.json());document.getElementById("rows").innerHTML=C.pizzas.map((p,i)=>`<tr><td><b>${esc(p[0])}</b><div class="sub">${p[1].join(" · ")}</div></td><td><input class="qty" data-q="${i}" type="number" min="0" step="1" value="0"></td></tr>`).join("");calc();if("serviceWorker"in navigator)navigator.serviceWorker.register("service-worker.js")}
function calc(){let t={},sp=new Set(),n=0,prep="";document.querySelectorAll("[data-q]").forEach(el=>{let q=Math.max(0,parseInt(el.value)||0);n+=q;if(!q)return;let p=C.pizzas[+el.dataset.q];p[1].forEach(name=>{if(C.spices.includes(name)){sp.add(name);return}let x=C.ingredients[name];if(!x)return;if(!t[name])t[name]={q:0,...x};t[name].q+=x.qty*q});for(let b=1;b<=q;b++){prep+=`<div class="box"><h3>📦 ${esc(p[0])} #${b}</h3>`;p[1].forEach((name,j)=>{let x=C.ingredients[name],d=C.spices.includes(name)?"":` — ${fmt(x.qty)} ${esc(x.unit)}`;let id=`c-${el.dataset.q}-${b}-${j}`;prep+=`<div class="check"><input id="${id}" type="checkbox"> <label for="${id}"><b>${esc(name)}</b>${d}</label></div>`});prep+="</div>"}});document.getElementById("count").innerHTML=n?`<b>${n} pizza${n>1?"s":""}</b>`:"Aucune pizza sélectionnée";document.getElementById("shop").innerHTML=Object.entries(t).sort().map(([name,x])=>{let np=x.pack?Math.ceil((x.q-1e-9)/x.pack):0,b=x.pack?np*x.pack:x.q;return `<tr><td>${esc(name)}</td><td>${fmt(x.q)} ${x.unit}</td><td><b>${fmt(b)} ${x.unit}</b><div class="small">${x.pack?np+" × "+x.pack+" "+x.unit:""}</div></td></tr>`}).join("");document.getElementById("spices").innerHTML=[...sp].sort().map(x=>`<div>☐ <b>${esc(x)}</b></div>`).join("")||'<span class="small">Aucun</span>';document.getElementById("prep").innerHTML=prep||'<span class="small">Les boîtes apparaîtront ici.</span>'}
function resetAll(){document.querySelectorAll("[data-q]").forEach(x=>x.value=0);calc()}init();
</script></body></html>
